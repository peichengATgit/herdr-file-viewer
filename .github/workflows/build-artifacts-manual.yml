name: Build Linux artifact (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1
          targets: x86_64-unknown-linux-musl

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package plugin with its executable
        run: |
          mkdir -p dist "$RUNNER_TEMP/plugin/herdr-file-viewer"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/plugin/herdr-file-viewer"
          plugin="$RUNNER_TEMP/plugin/herdr-file-viewer"
          mkdir -p "$plugin/target/release"
          install -m 755 target/x86_64-unknown-linux-musl/release/herdr-file-viewer \
            "$plugin/target/release/herdr-file-viewer"
          file "$plugin/target/release/herdr-file-viewer" > dist/BUILD_INFO.txt
          readelf -l "$plugin/target/release/herdr-file-viewer" > "$RUNNER_TEMP/program-headers.txt"
          readelf -d "$plugin/target/release/herdr-file-viewer" > "$RUNNER_TEMP/dynamic-section.txt"
          if grep -q 'INTERP' "$RUNNER_TEMP/program-headers.txt" || grep -q '(NEEDED)' "$RUNNER_TEMP/dynamic-section.txt"; then
            echo "error: Linux artifact requires a dynamic loader or shared libraries" >&2
            exit 1
          fi
          "$plugin/target/release/herdr-file-viewer" --open-direction
          {
            echo "commit=$GITHUB_SHA"
            echo "target=x86_64-unknown-linux-musl"
            echo "rust=1.96.1"
          } >> dist/BUILD_INFO.txt
          cp dist/BUILD_INFO.txt "$plugin/BUILD_INFO.txt"
          tar -czf dist/herdr-file-viewer-linux-x86_64.tar.gz \
            -C "$RUNNER_TEMP/plugin" herdr-file-viewer
          cd dist
          sha256sum herdr-file-viewer-linux-x86_64.tar.gz > SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-file-viewer-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
